# 환자 ID 로 진료내역을 조회하고, 식별정보를 뺀 결과만 청구 판단 워크플로에 넘긴다.
#
# 기획서 §5.2 — "환자 식별은 SQL 조회 단계에서만 사용하고, AI 에 전달되는 SELECT
# 결과에서는 환자 ID 와 민감정보를 제외한다." 그 SQL 이 이 워크플로다.
# 조인도 여기서 끝낸다(§7.3). AI 는 DB 에 접속하지 않는다 — 접속할 것도 없다.
#
# 들어오는 길은 하나다 — 화면에서 환자 ID 를 넣으면 이 워크플로를 부른다.
# 이슈로도 받던 길이 있었는데 걷어냈다. 요청이 이슈로 들어오면 환자 번호가
# 저장소에 남고, 그걸 지우는 단계를 또 붙여야 했다. 애초에 안 남기는 편이 낫다.
#
# 왜 워크플로가 둘인가 — 기획서 §5.1: AI 는 요청 원문을 보면 안 된다
# (환자 ID 가 들어 있다). 에이전트 워크플로를 요청 이벤트에 직접 걸면 그 컨텍스트가
# 프롬프트에 실린다. 그래서 여기서 조회까지 끝내고, 에이전트는
# workflow_dispatch 로 부른다 — 그쪽엔 비식별 진료행만 넘어간다.
name: billing-intake

on:
  workflow_dispatch:
    inputs:
      patient_id:
        description: "환자 ID (P00001 형식)"
        required: true
      treatment_date:
        description: "진료일 (YYYY-MM-DD, 비우면 전체 기간)"
        required: false
        default: ""
      # 판단에 쓸 모델을 실행할 때 고른다. 이슈에 코파일럿을 붙여 고르던 것을
      # 여기로 옮겼다 — 요청이 이슈로 들어오지 않게 되면서 그 화면이 없어졌다.
      # auto 는 Copilot 이 알아서 고른다. 나머지는 요금제에 따라 안 될 수 있다.
      model:
        description: "판단에 쓸 모델"
        required: false
        type: choice
        default: auto
        options: [auto, sonnet, opus, haiku, gpt-5, gemini-pro]

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: ghcr.io/${{ github.repository }}-db:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: billing
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U billing -d billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 진료내역 조회 (SQL JOIN 뒤 식별정보 제거)
        id: query
        env:
          PGPASSWORD: billing
          # 환자 ID 를 env 로 받지 않는다. 러너는 스텝을 시작할 때 env 목록을 로그에
          # 그대로 찍는데, 그건 ::add-mask:: 가 걸리기 전이다 —
          # INPUT_PATIENT_ID: P00013 이 실행 로그에 남았다. 실제로 그랬다.
          # 이벤트 파일에서 직접 읽으면 로그에 나올 자리가 없다.
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          INPUT_PATIENT_ID=$(jq -r '.inputs.patient_id // ""' "$GITHUB_EVENT_PATH")
          INPUT_TREATMENT_DATE=$(jq -r '.inputs.treatment_date // ""' "$GITHUB_EVENT_PATH")

          # 환자 ID는 이 스텝에서 끝난다. 밖으로 나가는 것은 비식별 진료행뿐이다.
          PATIENT_ID=$(printf '%s' "${INPUT_PATIENT_ID:-}" | grep -oE 'P[0-9]{5}' | head -1 || true)
          if [ -z "$PATIENT_ID" ]; then
            emit ok 0
            emit reason "환자 ID(P#####)를 찾지 못했습니다"
            exit 0
          fi
          echo "::add-mask::$PATIENT_ID"

          TREATMENT_DATE=$(printf '%s' "${INPUT_TREATMENT_DATE:-}" |
            grep -oE '20[0-9]{2}-[01][0-9]-[0-3][0-9]' | head -1 || true)
          FILTER=""
          if [ -n "$TREATMENT_DATE" ]; then
            FILTER="AND c.treatment_date = '$TREATMENT_DATE'"
          fi

          # 조인은 llm.claim 뷰가 이미 해 뒀다 — 그 뷰가 "AI 에게 나갈 수 있는 열" 의
          # 정의다. 여기서는 조회 키인 patient_id 한 열만 빼고 그대로 넘긴다.
          # 열을 손으로 나열하지 않아서, 뷰에 열이 늘어도 빠뜨려 새는 일이 없다.
          CLAIMS=$(psql -X -qAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -U billing -d billing -c "
            SELECT coalesce(
                     jsonb_agg(to_jsonb(c) - 'patient_id' ORDER BY c.treatment_date),
                     '[]'::jsonb)
            FROM llm.claim c
            WHERE c.patient_id = '$PATIENT_ID' $FILTER")

          N=$(printf '%s' "$CLAIMS" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          if [ "$N" = "0" ]; then
            emit ok 0
            emit reason "해당 환자 ID의 진료내역이 없습니다"
            exit 0
          fi

          # 나가기 전에 한 번 본다. 식별값이 남아 있으면 여기서 세운다 —
          # 조용히 넘어가면 그대로 프롬프트에 실린다.
          if printf '%s' "$CLAIMS" | grep -qE 'P[0-9]{5}'; then
            echo "::error::조회 결과에 환자 ID 가 남아 있습니다"; exit 1
          fi
          if [ "${#CLAIMS}" -gt 60000 ]; then
            echo "::error::진료내역이 너무 큽니다 (${#CLAIMS}자). 진료일을 지정해 주세요."; exit 1
          fi

          emit ok 1
          emit count "$N"
          emit treatment_date "${TREATMENT_DATE:-}"
          printf 'claims<<CLAIMS_EOF\n%s\nCLAIMS_EOF\n' "$CLAIMS" >> "$GITHUB_OUTPUT"
          echo "진료 $N 건을 비식별로 뽑았습니다 (진료일 ${TREATMENT_DATE:-전체})"

          # 무엇을 뽑았는지 요약에 적는다. 진료일과 수가코드뿐이고 식별값은 없다.
          # 이게 없으면 판단이 끝날 때까지 무엇이 조회됐는지 알 수가 없다.
          {
            echo "## 진료내역 $N 건을 뽑았습니다"
            echo
            echo "| 진료일 | 수가코드 | 항목 |"
            echo "|---|---|---|"
            printf '%s' "$CLAIMS" | python3 -c "
          import json,sys
          for c in json.load(sys.stdin):
              print('| %s | %s | %s |' % (c['treatment_date'], c['hira_fee_code'], c['order_name']))
          "
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 청구 판단 워크플로 호출
        if: steps.query.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          # 셸에 직접 끼워 넣지 않는다. 값 안의 따옴표가 명령을 부순다.
          CLAIMS: ${{ steps.query.outputs.claims }}
        run: |
          set -euo pipefail
          # auto 는 gh aw 에서 "지정 안 함" 이다. 빈 값으로 넘겨야 Copilot 이 고른다.
          MODEL="${{ inputs.model }}"
          [ "$MODEL" = "auto" ] && MODEL=""

          gh workflow run billing-review.lock.yml --repo "${{ github.repository }}" \
            -f claims="$CLAIMS" \
            -f treatment_date="${{ steps.query.outputs.treatment_date }}" \
            -f model="$MODEL"

          {
            echo "## 진료비 판단을 시작했습니다"
            echo
            echo "진료 ${{ steps.query.outputs.count }}건을 비식별로 뽑아 넘겼습니다. 모델: \`${{ inputs.model }}\`"
            echo
            echo "결과는 **billing-review** 실행의 Artifacts 에 \`billing-report\` 로 올라옵니다."
            echo "이슈·PR·커밋 어디에도 남기지 않습니다."
            echo
            echo "[billing-review 실행 보기](${{ github.server_url }}/${{ github.repository }}/actions/workflows/billing-review.lock.yml)"
          } >> "$GITHUB_STEP_SUMMARY"

      # 실패도 실행 안에서만 알린다. 환자를 못 찾았다는 사실조차 저장소에 남기지 않는다.
      - name: 환자를 못 찾으면 알린다
        if: steps.query.outputs.ok != '1'
        env:
          REASON: ${{ steps.query.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo "## 확인을 시작하지 못했습니다"
            echo
            echo "$REASON"
            echo
            echo "**환자 ID** 를 확인해 주세요. (P + 5자리 숫자)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
