# 환자 ID 를 받아 토큰으로 바꾸고, 청구 판단 워크플로를 부른다.
#
# 들어오는 길이 둘이다.
#   1) 대시보드에서 환자 ID 를 넣고 넘어온 수동 실행 (workflow_dispatch)
#   2) 이슈 등록 (기존 경로 — 코파일럿을 직접 붙여 볼 때 쓴다)
#
# 왜 워크플로가 둘인가 — 기획서 §5.1: AI 는 이슈 본문을 보면 안 된다(환자 ID 가 들어 있다).
# 에이전트 워크플로를 이슈 이벤트로 직접 걸면 이슈 컨텍스트가 프롬프트에 실린다.
# 그래서 여기서 ID 를 토큰으로 바꾸고, 에이전트는 workflow_dispatch 로 부른다 —
# 그쪽엔 이슈 컨텍스트가 아예 없고 토큰과 이슈 번호만 넘어간다.
name: billing-intake

on:
  workflow_dispatch:
    inputs:
      patient_id:
        description: "환자 ID (P00001 형식)"
        required: true
      treatment_date:
        description: "진료일 (YYYY-MM-DD, 비우면 전체 기간)"
        required: false
        default: ""
  issues:
    # 이슈를 만들면 바로 돈다. 담당자 지정을 기다리지 않는다.
    # labeled 도 받는 이유는 라벨을 나중에 붙여 다시 돌릴 수 있게 하려는 것이다.
    types: [opened, labeled]

permissions:
  contents: read
  packages: read
  issues: write
  actions: write

jobs:
  intake:
    # 이슈 경로는 라벨이 아니라 제목으로 판별한다. 이슈 템플릿은 레포에 이미 있는
    # 라벨만 붙일 수 있어서, template 에서 새로 만든 레포에서는 조용히 안 붙는다.
    # 제목 접두사는 템플릿이 항상 넣는다.
    #
    # 아래에서 만드는 결과 이슈의 제목은 이 접두사를 피한다 — 그러지 않으면
    # 결과 이슈가 다시 이 워크플로를 불러 끝없이 돈다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.issue.title, '진료비 확인')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: ghcr.io/${{ github.repository_owner }}/hira-billing-db:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: billing
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U billing -d billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 환자 ID를 토큰으로
        id: resolve
        env:
          PGPASSWORD: billing
          # 이슈 본문은 이 스텝 안에서만 쓴다. 에이전트 쪽으로는 넘어가지 않는다.
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_PATIENT_ID: ${{ inputs.patient_id }}
          INPUT_TREATMENT_DATE: ${{ inputs.treatment_date }}
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          # 환자 ID는 이 스텝에서 끝난다. 밖으로 나가는 것은 토큰뿐이다.
          if [ -n "${INPUT_PATIENT_ID:-}" ]; then
            SOURCE="${INPUT_PATIENT_ID}"
          else
            SOURCE="${ISSUE_BODY:-}"
          fi
          PATIENT_ID=$(printf '%s' "$SOURCE" | grep -oE 'P[0-9]{5}' | head -1 || true)
          if [ -z "$PATIENT_ID" ]; then
            emit ok 0
            emit reason "환자 ID(P#####)를 찾지 못했습니다"
            exit 0
          fi
          echo "::add-mask::$PATIENT_ID"

          if [ -n "${INPUT_TREATMENT_DATE:-}" ]; then
            TREATMENT_DATE=$(printf '%s' "$INPUT_TREATMENT_DATE" |
              grep -oE '20[0-9]{2}-[01][0-9]-[0-3][0-9]' | head -1 || true)
          else
            TREATMENT_DATE=$(printf '%s' "${ISSUE_BODY:-}" |
              grep -oE '20[0-9]{2}-[01][0-9]-[0-3][0-9]' | head -1 || true)
          fi

          # 앱 자격증명으로만 해석한다. llm_reader에게는 이 함수 권한이 없다.
          TOKEN=$(psql -X -qAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -U billing -d billing \
            -c "SELECT coalesce(public.resolve_patient_token('$PATIENT_ID'), '')")

          if [ -z "$TOKEN" ]; then
            emit ok 0
            emit reason "해당 환자 ID가 진료 데이터에 없습니다"
            exit 0
          fi

          emit ok 1
          emit token "$TOKEN"
          emit patient_id "$PATIENT_ID"
          emit treatment_date "${TREATMENT_DATE:-}"
          echo "환자 확인됨 - 토큰 $TOKEN (진료일 필터 ${TREATMENT_DATE:-전체})"

      # 이슈로 들어온 경우, 본문에 적힌 환자 ID 를 가린다.
      # 이슈는 레포를 볼 수 있는 사람 모두에게 계속 남는다. 트리거로 쓰는 것은
      # 괜찮지만 환자 번호가 거기 남아 있으면 안 된다. 판단에 필요한 값은
      # 이미 위에서 토큰으로 바꿔 뒀으므로 원본은 더 필요 없다.
      - name: 이슈에 적힌 환자 ID 가리기
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          NEW_BODY=$(printf '%s' "${ISSUE_BODY:-}" | sed -E 's/P[0-9]{5}/P****/g')
          NEW_TITLE=$(printf '%s' "${ISSUE_TITLE:-}" | sed -E 's/P[0-9]{5}/P****/g')
          if [ "$NEW_BODY" = "${ISSUE_BODY:-}" ] && [ "$NEW_TITLE" = "${ISSUE_TITLE:-}" ]; then
            echo "가릴 환자 ID 가 없습니다"
            exit 0
          fi
          gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}"             --title "$NEW_TITLE" --body "$NEW_BODY"
          echo "이슈 #${{ github.event.issue.number }} 의 환자 ID 를 가렸습니다"

      - name: 청구 판단 워크플로 호출
        if: steps.resolve.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run billing-review.lock.yml --repo "${{ github.repository }}" \
            -f patient_token="${{ steps.resolve.outputs.token }}" \
            -f issue_number="${{ steps.target.outputs.number }}" \
            -f treatment_date="${{ steps.resolve.outputs.treatment_date }}"

      - name: 환자를 못 찾으면 알린다
        if: steps.resolve.outputs.ok != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ steps.resolve.outputs.reason }}
        run: |
          set -euo pipefail
          MSG="확인을 시작하지 못했습니다 - $REASON

          **환자 ID**를 확인해 주세요. (P + 5자리 숫자)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" --body "$MSG"
