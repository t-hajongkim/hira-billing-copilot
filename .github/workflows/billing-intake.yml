# 환자 ID 를 받아 토큰으로 바꾸고, 청구 판단 워크플로를 부른다.
#
# 들어오는 길은 하나다 — 대시보드에서 환자 ID 를 넣으면 이 워크플로를 부른다.
# 이슈로도 받던 길이 있었는데 걷어냈다. 요청이 이슈로 들어오면 환자 번호가
# 저장소에 남고, 그걸 지우는 단계를 또 붙여야 했다. 애초에 안 남기는 편이 낫다.
#
# 왜 워크플로가 둘인가 — 기획서 §5.1: AI 는 요청 원문을 보면 안 된다
# (환자 ID 가 들어 있다). 에이전트 워크플로를 요청 이벤트에 직접 걸면 그 컨텍스트가
# 프롬프트에 실린다. 그래서 여기서 ID 를 토큰으로 바꾸고, 에이전트는
# workflow_dispatch 로 부른다 — 그쪽엔 토큰만 넘어간다.
name: billing-intake

on:
  workflow_dispatch:
    inputs:
      patient_id:
        description: "환자 ID (P00001 형식)"
        required: true
      treatment_date:
        description: "진료일 (YYYY-MM-DD, 비우면 전체 기간)"
        required: false
        default: ""

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: ghcr.io/${{ github.repository_owner }}/hira-billing-db:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: billing
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U billing -d billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 환자 ID를 토큰으로
        id: resolve
        env:
          PGPASSWORD: billing
          INPUT_PATIENT_ID: ${{ inputs.patient_id }}
          INPUT_TREATMENT_DATE: ${{ inputs.treatment_date }}
        run: |
          set -euo pipefail
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          # 환자 ID는 이 스텝에서 끝난다. 밖으로 나가는 것은 토큰뿐이다.
          PATIENT_ID=$(printf '%s' "${INPUT_PATIENT_ID:-}" | grep -oE 'P[0-9]{5}' | head -1 || true)
          if [ -z "$PATIENT_ID" ]; then
            emit ok 0
            emit reason "환자 ID(P#####)를 찾지 못했습니다"
            exit 0
          fi
          echo "::add-mask::$PATIENT_ID"

          TREATMENT_DATE=$(printf '%s' "${INPUT_TREATMENT_DATE:-}" |
            grep -oE '20[0-9]{2}-[01][0-9]-[0-3][0-9]' | head -1 || true)

          # 앱 자격증명으로만 해석한다. llm_reader에게는 이 함수 권한이 없다.
          TOKEN=$(psql -X -qAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -U billing -d billing \
            -c "SELECT coalesce(public.resolve_patient_token('$PATIENT_ID'), '')")

          if [ -z "$TOKEN" ]; then
            emit ok 0
            emit reason "해당 환자 ID가 진료 데이터에 없습니다"
            exit 0
          fi

          emit ok 1
          emit token "$TOKEN"
          emit patient_id "$PATIENT_ID"
          emit treatment_date "${TREATMENT_DATE:-}"
          echo "환자 확인됨 - 토큰 $TOKEN (진료일 필터 ${TREATMENT_DATE:-전체})"

      - name: 청구 판단 워크플로 호출
        if: steps.resolve.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run billing-review.lock.yml --repo "${{ github.repository }}" \
            -f patient_token="${{ steps.resolve.outputs.token }}" \
            -f treatment_date="${{ steps.resolve.outputs.treatment_date }}"

          {
            echo "## 진료비 판단을 시작했습니다"
            echo
            echo "결과는 **billing-review** 실행의 Artifacts 에 \`billing-report\` 로 올라옵니다."
            echo "이슈·PR·커밋 어디에도 남기지 않습니다."
            echo
            echo "[billing-review 실행 보기](${{ github.server_url }}/${{ github.repository }}/actions/workflows/billing-review.lock.yml)"
          } >> "$GITHUB_STEP_SUMMARY"

      # 실패도 실행 안에서만 알린다. 환자를 못 찾았다는 사실조차 저장소에 남기지 않는다.
      - name: 환자를 못 찾으면 알린다
        if: steps.resolve.outputs.ok != '1'
        env:
          REASON: ${{ steps.resolve.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo "## 확인을 시작하지 못했습니다"
            echo
            echo "$REASON"
            echo
            echo "**환자 ID** 를 확인해 주세요. (P + 5자리 숫자)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
