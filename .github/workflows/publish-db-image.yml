# 환자/진료 DB 이미지를 GHCR 에 올린다.
# 빌드 중 init.sql 끝의 경계 게이트가 돌기 때문에, 식별 열이 뷰에 새어 든 이미지는
# 애초에 만들어지지 않는다.
#
# 이 워크플로는 원본 저장소에서만 돈다. 복사본은 원본이 올려 둔 **공개 이미지**를
# 익명으로 받아 쓰기 때문이다 — 그래야 계정 이름이 참조에 들어가지 않고,
# 대문자가 섞인 계정에서도 깨지지 않는다.
# 데이터(db/data/*.csv)를 고쳤다면 원본에서 이 워크플로를 다시 돌린다.
name: "0. DB 이미지 만들기"

on:
  push:
    branches: [main]
    paths: ["db/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # 복사본에서는 돌지 않는다. 복사본은 원본의 공개 이미지를 받아 쓴다.
    if: github.repository == 't-hajongkim/hira-billing-copilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # GHCR 은 대문자가 들어간 이름을 받지 않는다. 여기서 미리 세운다 —
      # 안 그러면 docker push 가 알아보기 어려운 말로 실패한다.
      - name: 저장소 이름 확인
        run: |
          set -eu
          NAME="${{ github.repository }}"
          if [ "$NAME" != "$(printf '%s' "$NAME" | tr 'A-Z' 'a-z')" ]; then
            echo "::error::저장소 이름에 대문자가 있습니다 ($NAME). GHCR 은 소문자만 받습니다."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 빌드
        run: docker build -t ghcr.io/${{ github.repository }}-db:latest db

      - name: 경계 검사 — 올리기 전에
        env:
          LLM_DB_PASSWORD: ${{ secrets.LLM_DB_PASSWORD }}
        run: bash db/test-access.sh ghcr.io/${{ github.repository }}-db:latest

      - name: 올리기
        run: docker push ghcr.io/${{ github.repository }}-db:latest
