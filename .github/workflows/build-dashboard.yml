# 청구 현황 대시보드를 굽고 Pages 로 올린다.
#
# Pages 사이트는 인터넷에 공개된다. 여기 올라가는 것은 llm.claim 뷰에서 온
# 비식별 합성 데이터뿐이고, 환자 이름·ID·생년월일은 뷰에 열 자체가 없다.
# **실제 병원 데이터를 넣는다면 Pages 를 끄십시오.**
#
# 브랜치 소스는 / 와 /docs 만 받는다. site/ 를 그대로 쓰려고 Actions 배포를 쓴다.
# 커밋도 그대로 남긴다 — Pages 를 안 켠 사람은 파일을 내려받아 더블클릭하면 된다.
name: build-dashboard

on:
  # db/data 가 바뀌면 이미지부터 다시 올라가야 한다. push 로 같이 걸면
  # 대시보드가 옛 이미지를 읽는다 — 실제로 두 워크플로가 같은 초에 시작해 그렇게 됐다.
  # 그래서 이미지 게시가 끝난 뒤에 돈다.
  workflow_run:
    workflows: [publish-db-image]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "site/dashboard.template.html"
      - "tools/build_dashboard.py"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    # workflow_run 으로 왔으면 그 실행이 성공했을 때만.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: ghcr.io/${{ github.repository_owner }}/hira-billing-db:latest
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: billing
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U billing -d billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 빌드 로직 점검
        run: python tools/build_dashboard.py --check

      - name: 대시보드 굽기
        run: |
          python tools/build_dashboard.py \
            --dsn "postgresql://llm_reader:llm-readonly@127.0.0.1:5432/billing"

      - name: 자립성 확인
        run: |
          set -e
          # 주석은 검사에서 뺀다 — 규칙을 설명하는 글이 규칙 위반으로 잡힌다.
          body=$(sed '/<!--/,/-->/d' site/index.html)

          for pat in 'type="module"' 'import(' 'importScripts(' '<script src' 'XMLHttpRequest'; do
            if printf '%s' "$body" | grep -qF "$pat"; then
              echo "::error::대시보드가 자립성을 잃었습니다: $pat"
              exit 1
            fi
          done
          if printf '%s' "$body" | grep -qE '(src|href)="https?://'; then
            echo "::error::외부 리소스를 참조합니다."
            exit 1
          fi

          # 나가는 요청은 딱 하나만 허용한다 — 워크플로를 부르는 GitHub API.
          # 화면 데이터를 밖에서 끌어오기 시작하면 오프라인에서 못 연다.
          n=$(printf '%s' "$body" | grep -c 'fetch(' || true)
          if [ "$n" -gt 1 ]; then
            echo "::error::fetch 가 $n 곳입니다. 워크플로 호출 하나만 허용됩니다."
            exit 1
          fi
          if [ "$n" -eq 1 ] && ! printf '%s' "$body" | grep -q 'fetch("https://api.github.com/'; then
            echo "::error::fetch 가 api.github.com 이 아닌 곳을 부릅니다."
            exit 1
          fi

          hosts=$(printf '%s' "$body" | grep -oE 'https?://[a-zA-Z0-9.-]+' | sort -u |
                  grep -vE '^https://(api\.)?github\.com$' || true)
          if [ -n "$hosts" ]; then
            echo "::error::허용되지 않은 호스트: $hosts"
            exit 1
          fi

          echo "자립성 OK — 화면은 오프라인에서 열리고, 나가는 요청은 워크플로 호출뿐입니다."

      - name: 변경 있으면 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git diff --cached --quiet || git commit -m "청구 대시보드 재생성"
          git push

      - name: Pages 묶음 만들기
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # Pages 를 안 켠 저장소에서는 이 잡이 실패한다. 그래도 대시보드는 이미
  # 커밋돼 있으니 continue-on-error 로 두고 넘어간다 — 켠 사람만 웹으로 본다.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
