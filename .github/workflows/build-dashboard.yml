# 청구 현황 대시보드를 굽고 Pages 로 올린다.
#
# Pages 사이트는 인터넷에 공개된다. 여기 올라가는 것은 llm.claim 뷰에서 온
# 비식별 합성 데이터뿐이고, 환자 이름·ID·생년월일은 뷰에 열 자체가 없다.
# **실제 병원 데이터를 넣는다면 Pages 를 끄십시오.**
#
# 브랜치 소스는 / 와 /docs 만 받는다. site/ 를 그대로 쓰려고 Actions 배포를 쓴다.
# 커밋도 그대로 남긴다 — Pages 를 안 켠 사람은 파일을 내려받아 더블클릭하면 된다.
name: "9. 확인 화면 다시 굽기"

on:
  push:
    branches: [main]
    paths:
      - "rules/**"
      - "db/**"
      - "site/dashboard.template.html"
      - "tools/build_dashboard.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        # 이미지가 public 이라 자격증명 없이 익명으로 받는다. 자기 계정으로 로그인하면
        # 복사한 저장소에서 패키지 접근이 거부되어 오히려 실패한다.
        image: ghcr.io/t-hajongkim/hira-billing-copilot-db:latest
        env:
          POSTGRES_DB: billing
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
          # 읽기 역할의 비밀번호는 이미지에 없다. 실행할 때 들어온다.
          LLM_DB_PASSWORD: ${{ secrets.LLM_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U billing -d billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # 경계는 세울 때마다 확인한다. 예전에는 이미지를 올리기 전에 한 번 봤는데,
      # 이미지를 없앴으니 이 자리에서 본다 — 오히려 매 실행마다 보게 된다.
      - name: 경계 검사
        env:
          LLM_DB_PASSWORD: ${{ secrets.LLM_DB_PASSWORD }}
        run: bash db/test-access.sh --local
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 빌드 로직 점검
        run: python tools/build_dashboard.py --check

      - name: 대시보드 굽기
        env:
          # 비밀번호는 DSN 이 아니라 여기로 넘긴다 - 특수문자가 섞여도 안전하다.
          PGPASSWORD: ${{ secrets.LLM_DB_PASSWORD }}
        # 청구 데이터는 비식별 뷰(llm_reader)로 읽는다.
        # --app-dsn 은 환자 ID 범위(P00001 ~ P00050) 한 줄만 읽는다 —
        # 검색창에 무엇을 넣을지 알려 주려는 것이고, 진료 내용과는 잇히지 않는다.
        run: |
          python tools/build_dashboard.py \
            --dsn "postgresql://llm_reader@127.0.0.1:5432/billing" \
            --app-dsn "postgresql://billing:billing@127.0.0.1:5432/billing"

      - name: 자립성 확인
        run: |
          set -e
          # 주석은 검사에서 뺀다 — 규칙을 설명하는 글이 규칙 위반으로 잡힌다.
          body=$(sed '/<!--/,/-->/d' site/index.html)

          for pat in 'type="module"' 'import(' 'importScripts(' '<script src' 'XMLHttpRequest'; do
            if printf '%s' "$body" | grep -qF "$pat"; then
              echo "::error::대시보드가 자립성을 잃었습니다: $pat"
              exit 1
            fi
          done
          if printf '%s' "$body" | grep -qE '(src|href)="https?://[^"]*"' &&
             printf '%s' "$body" | grep -oE '(src|href)="https?://[^"]*"' |
               grep -qvE '"https://github\.com/'; then
            echo "::error::외부 리소스를 참조합니다."
            exit 1
          fi

          # 화면이 말을 거는 곳은 GitHub 하나뿐이어야 한다.
          # 워크플로 실행, 실행 상태 조회, 결과 파일 내려받기 — 전부 api.github.com 이다.
          # 횟수는 세지 않는다. 세면 기능을 늘릴 때마다 검사부터 고치게 된다.
          # 대신 주소가 GitHub 이 아닌 것이 하나라도 있으면 세운다.
          hosts=$(printf '%s' "$body" | grep -oE 'https?://[a-zA-Z0-9.-]+' | sort -u |
                  grep -vE '^https://(api\.)?github\.com$' || true)
          if [ -n "$hosts" ]; then
            echo "::error::허용되지 않은 호스트: $hosts"
            exit 1
          fi
          if ! printf '%s' "$body" | grep -q 'API = "https://api.github.com"'; then
            echo "::error::GitHub API 주소가 상수로 박혀 있지 않습니다."
            exit 1
          fi

          # 화면에 토큰이 구워지면 안 된다 — 페이지는 토큰으로 할 일이 없다.
          if printf '%s' "$body" | grep -qE '"(PT|EN)_[0-9a-f]{12}"'; then
            echo "::error::화면에 토큰이 구워졌습니다."
            exit 1
          fi

          echo "자립성 OK — 나가는 요청은 GitHub 뿐이고, 화면에 토큰은 없습니다."

      - name: 변경 있으면 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          if git diff --cached --quiet; then
            echo "대시보드가 그대로입니다 - 커밋할 것이 없습니다."
            exit 0
          fi
          git commit -m "청구 대시보드 재생성"

          # 이미지 게시와 push 가 겹치면 이 실행이 둘 이상 뜨고, 뒤에 온 쪽이 밀린다.
          # 실제로 그렇게 실패했다. 밀리면 다시 얹어 본다 - 우리 커밋은 이 파일 하나다.
          for try in 1 2 3; do
            if git push; then exit 0; fi
            echo "밀렸습니다 - 다시 얹습니다 ($try/3)"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::대시보드 커밋을 올리지 못했습니다."
          exit 1

      - name: Pages 묶음 만들기
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # Pages 를 안 켠 저장소에서는 이 잡이 실패한다. 그래도 대시보드는 이미
  # 커밋돼 있으니 continue-on-error 로 두고 넘어간다 — 켠 사람만 웹으로 본다.
  #
  # 워크플로가 Pages 를 대신 켜 줄 수는 없다. actions/configure-pages 의 enablement
  # 옵션은 "requires a token other than GITHUB_TOKEN" 이라고 못박혀 있다 —
  # 저장소 설정을 바꾸는 일이라 관리 권한이 필요하고, 실행 토큰에는 그게 없다.
  # 그래서 한 번은 사람이 켜야 한다. 대신 안 켜져 있으면 아래에서 그렇게 말해 준다.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Pages 가 꺼져 있으면 알린다
        if: failure()
        run: |
          {
            echo "## Pages 가 아직 켜져 있지 않습니다"
            echo
            echo "**Settings → Pages → Source: GitHub Actions** 를 한 번 골라 주세요."
            echo "저장소 설정을 바꾸는 일이라 워크플로가 대신 켤 수 없습니다."
            echo
            echo "켜고 나면 이 워크플로를 다시 실행하면 됩니다."
            echo "대시보드 파일(\`site/index.html\`)은 이미 커밋돼 있으니, 켜지 않아도"
            echo "내려받아 더블클릭하면 똑같이 동작합니다."
          } >> "$GITHUB_STEP_SUMMARY"
