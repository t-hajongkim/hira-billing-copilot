services:
  postgres:
    # GHCR_REPO 를 본인 저장소(<아이디>/<저장소>)로 두고 쓴다.
    # 이미지는 각자 자기 GHCR 에 올라간다 — 남의 패키지에 접근 권한을 받을 일이 없다.
    image: ghcr.io/${GHCR_REPO:?GHCR_REPO 를 본인 저장소(<아이디>/<저장소>)로 설정하세요}-db:latest
    pull_policy: always
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "5432:5432"
