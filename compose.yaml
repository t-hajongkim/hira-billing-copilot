services:
  postgres:
    # 표준 이미지에 init.sql 을 부어 세운다. 우리 이미지를 따로 만들지 않는다.
    # \copy 는 psql 의 cwd(/) 기준이라 ./db 를 /db 에 걸어 두면 경로가 맞는다.
    image: postgres:17-alpine
    volumes:
      - ./db:/db:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "5432:5432"
