services:
  postgres:
    # 공개 이미지라 로그인 없이 받는다. 읽기 역할의 비밀번호만 넣어 주면 된다.
    image: ghcr.io/t-hajongkim/hira-billing-copilot-db:latest
    pull_policy: always
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      LLM_DB_PASSWORD: ${LLM_DB_PASSWORD:?LLM_DB_PASSWORD 를 정해서 넣으세요}
    ports:
      - "5432:5432"
